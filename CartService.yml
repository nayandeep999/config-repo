spring:
  application:
    name: CartService

  datasource:
    url: jdbc:mysql://localhost:3306/microservices
    username: root
    password: "0000"

  jpa:
    hibernate:
      ddl-auto: update

server:
  port: 8083

eureka:
  instance:
    hostname: localhost
    prefer-ip-address: true
    ip-address: 127.0.0.1

management:
  tracing:
    enabled: true
    sampling:
      probability: 1.0

  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

logging:
  pattern:
    level: "%5p [${spring.application.name:},traceId=%X{traceId:-},spanId=%X{spanId:-}]"